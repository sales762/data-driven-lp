<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせありがとうございます | データドリブン・可視化実行支援チーム</title>
  <style>
    :root {
      --navy: #0d1f3c;
      --navy-light: #1a2e4a;
      --green: #1a9e75;
      --green-light: #22c490;
      --white: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(13,31,60,0.95);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 16px 32px;
    }
    .header-logo {
      font-size: 15px;
      font-weight: 700;
      color: var(--white);
      text-decoration: none;
      letter-spacing: 0.02em;
    }
    .header-logo span {
      color: var(--green-light);
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }
    .thanks-card {
      background: var(--navy-light);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 60px 48px;
      max-width: 600px;
      width: 100%;
      text-align: center;
    }
    .thanks-icon {
      width: 72px;
      height: 72px;
      background: var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
    }
    .thanks-icon svg {
      width: 36px;
      height: 36px;
      stroke: #fff;
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .thanks-eyebrow {
      font-size: 13px;
      color: var(--green-light);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .thanks-h1 {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.4;
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }
    .thanks-body {
      font-size: 15px;
      line-height: 1.8;
      color: rgba(255,255,255,0.75);
      margin-bottom: 36px;
    }
    .thanks-note {
      background: rgba(26,158,117,0.12);
      border: 1px solid rgba(26,158,117,0.3);
      border-radius: 8px;
      padding: 16px 20px;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      line-height: 1.7;
      margin-bottom: 36px;
      text-align: left;
    }
    .thanks-note strong {
      color: var(--green-light);
    }
    .btn-back {
      display: inline-block;
      background: var(--green);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 40px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s;
      letter-spacing: 0.02em;
    }
    .btn-back:hover { background: var(--green-light); }
    footer {
      background: rgba(13,31,60,0.95);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 20px 32px;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
    }
    @media (max-width: 600px) {
      .thanks-card { padding: 40px 24px; }
      .thanks-h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="header-logo">可視化実行支援・<span>データ活用伴走チーム</span></a>
  </header>
  <main>
    <div class="thanks-card">
      <div class="thanks-icon">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="thanks-eyebrow">Thank You</div>
      <h1 class="thanks-h1">お問い合わせありがとうございます</h1>
      <p class="thanks-body">
        ご連絡いただき、誠にありがとうございます。<br>
        内容を確認の上、担当者よりご連絡いたします。<br>
        しばらくお待ちいただけますようお願いいたします。
      </p>
      <div class="thanks-note">
        <strong>返信について</strong><br>
        通常2営業日以内にメールまたはお電話にてご連絡いたします。<br>
        万が一、2営業日を過ぎても連絡がない場合は、お手数ですが<br>
        <strong>info@startchg.com</strong> までご連絡ください。
      </div>
      <a href="index.html" class="btn-back">トップページへ戻る</a>
    </div>
  </main>
  <footer>
    &copy; 2025 外部データ活用チーム / 株式会社 Start Challenge Consulting. All rights reserved.
  </footer>
</body>
</html>
